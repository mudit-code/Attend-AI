<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AttendAI - Smart Attendance System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Pre-render fallback loader styles before bundle loads */
      body {
        margin: 0;
        background: #FFF7F6;
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      }
      .pre-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #FFEBE8 0%, #FFF3F1 320px, #FFF9F8 100%);
        z-index: 99999;
        user-select: none;
      }
      .pre-emblem {
        position: relative;
        width: 68px;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      .pre-ring {
        position: absolute;
        inset: -10px;
        border-radius: 24px;
        border: 2px solid rgba(255, 40, 27, 0.3);
        animation: preRing 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      }
      .pre-icon {
        width: 100%;
        height: 100%;
        border-radius: 18px;
        background: linear-gradient(135deg, #FF382B 0%, #E81E12 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #FFFFFF;
        font-weight: 900;
        font-size: 1.85rem;
        box-shadow: 0 12px 32px rgba(255, 40, 27, 0.35);
        animation: preFloat 2.4s ease-in-out infinite;
      }
      .pre-title {
        font-size: 1.45rem;
        font-weight: 800;
        color: #1C1C26;
        letter-spacing: -0.3px;
        margin-bottom: 0.2rem;
      }
      .pre-subtitle {
        font-size: 0.75rem;
        font-weight: 700;
        color: #FF281B;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        margin-bottom: 1.5rem;
      }
      .pre-track {
        width: 150px;
        height: 5px;
        background: rgba(255, 40, 27, 0.12);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .pre-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #FF7B6E, #FF281B);
        border-radius: 999px;
        animation: preShimmer 1.3s ease-in-out infinite;
      }
      @keyframes preRing {
        0%, 100% { transform: scale(0.92); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 0; }
      }
      @keyframes preFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes preShimmer {
        0% { left: -50%; }
        100% { left: 120%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-loader">
        <div class="pre-emblem">
          <div class="pre-ring"></div>
          <div class="pre-icon">▲</div>
        </div>
        <div class="pre-title">AttendAI</div>
        <div class="pre-subtitle">Smart Attendance System</div>
        <div class="pre-track">
          <div class="pre-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
